
<!DOCTYPE html>
<html lang="en">
<head>

  <title>Happy Toy Shop</title>

      <div class="emoji">🧸</div>

      <p>Price: ৳500</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="toy">
        <div class="emoji">🧸</div>
        <h2>Teddy Bear</h2>

      </div>

      <div class="toy">
        <span class="football"> 
            <img src="download.png" alt="football">
        </span>
        <h2>FootBall </h2>
        <p>price: $200</p>

      </div>

    <div class="toy">

      <p>Price: ৳300</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="toy">
        <div class="emoji">🚗</div>
        <h2>Toy Car</h2>
        <p>Price: ৳300</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>

    <div class="toy">
      <div class="emoji">🪁</div>
      <h2>Colorful Kite</h2>
      <p>Price: ৳150</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
